version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/auth/repository/query/"
    schema: "migration/"
    gen:
      go:
        package: "repository"
        out: "internal/auth/repository"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  - engine: "postgresql"
    queries: "internal/accounts/repository/query/"
    schema: "migration/"
    gen:
      go:
        package: "repository"
        out: "internal/accounts/repository"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  - engine: "postgresql"
    queries: "internal/problems/repository/query/"
    schema: "migration/"
    gen:
      go:
        package: "repository"
        out: "internal/problems/repository"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"

